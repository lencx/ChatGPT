name: CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Mostrar estrutura do projeto
        run: |
          echo "Arquivos da raiz:"
          ls -la
          echo "Arquivos da pasta client:"
          ls -la client || echo "Pasta client não encontrada"

      - name: Instalar PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Instalar dependências do client
        working-directory: ./client
        run: pnpm install

      - name: Instalar dependências do server
        working-directory: ./server
        run: pnpm install

      - name: Build do client
        working-directory: ./client
        run: pnpm build

      - name: Rodar testes do server (se houver)
        working-directory: ./server
        run: pnpm test || echo "Sem testes configurados ainda"
