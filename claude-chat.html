<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f9fafb;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body.dark {
            background: #111827;
            color: #f9fafb;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 800px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #3b82f6;
            color: white;
        }

        .message.assistant .message-avatar {
            background: #8b5cf6;
            color: white;
        }

        .message-content {
            background: white;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .dark .message-content {
            background: #1f2937;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .message.user .message-content {
            background: #3b82f6;
            color: white;
        }

        .dark .message.user .message-content {
            background: #2563eb;
        }

        .message.assistant .message-content {
            background: #f3f4f6;
        }

        .dark .message.assistant .message-content {
            background: #374151;
        }

        .loading {
            display: flex;
            gap: 4px;
            padding: 8px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background: #9ca3af;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 8px 0;
        }

        .dark .error-message {
            background: #7f1d1d;
            color: #fecaca;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            gap: 12px;
        }

        .empty-state-icon {
            font-size: 48px;
        }

        .empty-state-text {
            font-size: 18px;
            font-weight: 500;
        }

        .empty-state-subtext {
            font-size: 14px;
            color: #6b7280;
        }

        .context-badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .dark .context-badge {
            background: #1e3a8a;
            color: #bfdbfe;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div class="empty-state">
            <div class="empty-state-icon">💬</div>
            <div class="empty-state-text">Claude Chat</div>
            <div class="empty-state-subtext">Messages sent from the input panel will appear here</div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        let conversationHistory = [];

        // Listen for theme changes
        const observer = new MutationObserver(() => {
            const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.body.classList.toggle('dark', isDark);
        });

        observer.observe(document.documentElement, {
            attributes: true,
            attributeFilter: ['class', 'data-theme']
        });

        // Initialize theme
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.classList.add('dark');
        }

        // Global function to be called from Rust
        window.addMessage = function(role, content) {
            const emptyState = chatContainer.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'user' ? 'U' : 'C';

            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.textContent = content;

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(messageContent);
            chatContainer.appendChild(messageDiv);

            // Scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Store in history
            conversationHistory.push({ role, content });
        };

        window.showLoading = function() {
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'loading-indicator';
            loadingDiv.className = 'message assistant';

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = 'C';

            const loadingContent = document.createElement('div');
            loadingContent.className = 'message-content loading';
            loadingContent.innerHTML = '<div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div>';

            loadingDiv.appendChild(avatar);
            loadingDiv.appendChild(loadingContent);
            chatContainer.appendChild(loadingDiv);

            chatContainer.scrollTop = chatContainer.scrollHeight;
        };

        window.hideLoading = function() {
            const loading = document.getElementById('loading-indicator');
            if (loading) {
                loading.remove();
            }
        };

        window.showError = function(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = `Error: ${message}`;
            chatContainer.appendChild(errorDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        };

        window.getConversationHistory = function() {
            return conversationHistory;
        };

        window.clearConversation = function() {
            conversationHistory = [];
            chatContainer.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <div class="empty-state-text">Claude Chat</div>
                    <div class="empty-state-subtext">Messages sent from the input panel will appear here</div>
                </div>
            `;
        };
    </script>
</body>
</html>
